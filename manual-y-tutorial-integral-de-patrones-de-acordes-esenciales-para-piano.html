<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Manual de Patrones de Acordes Esenciales para Piano by Rubén Sbarsky</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js para audio real de acordes de piano -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            900: '#1e1b4b',
                        },
                        accent: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Optimización de rendimiento para Samsung Galaxy A02s (720x1600px, fluidez a 60fps) */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        
        body {
            background-color: #080b12;
            color: #f1f5f9;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        /* Ocultar barra de scroll en la barra de pestañas manteniendo funcionalidad */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Estilo de agencia digital premium */
        .glass-header {
            background: rgba(8, 11, 18, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .premium-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.92), rgba(11, 15, 25, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .premium-card-highlight {
            background: linear-gradient(145deg, rgba(46, 16, 101, 0.35), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* Botones flotantes arrastrables */
        .draggable-fab {
            position: fixed;
            z-index: 90;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .draggable-fab:active {
            cursor: grabbing;
            transform: scale(1.08);
        }

        /* Teclado de piano virtual interactivo */
        .piano-key-white {
            height: 95px;
            flex: 1;
            background: linear-gradient(to bottom, #ffffff 0%, #e2e8f0 100%);
            border: 1px solid #94a3b8;
            border-radius: 0 0 6px 6px;
            position: relative;
            z-index: 1;
            transition: all 0.12s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
            color: #1e293b;
            font-weight: 700;
            font-size: 10px;
        }
        .piano-key-white.active {
            background: linear-gradient(to bottom, #a78bfa 0%, #7c3aed 100%);
            color: #ffffff;
            transform: translateY(2px);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.7);
        }
        .piano-key-black {
            height: 58px;
            width: 7%;
            background: linear-gradient(to bottom, #1e293b 0%, #090d16 100%);
            border: 1px solid #000;
            border-radius: 0 0 4px 4px;
            position: absolute;
            top: 0;
            z-index: 2;
            transition: all 0.12s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 4px;
            color: #cbd5e1;
            font-size: 8px;
            font-weight: 600;
        }
        .piano-key-black.active {
            background: linear-gradient(to bottom, #f59e0b 0%, #d97706 100%);
            color: #000;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
        }

        /* Animación de entrada de pestañas */
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-animate {
            animation: fadeInSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- CABECERA FIJA PERMANENTE + BARRA DE PESTAÑAS HORIZONTAL -->
    <header class="sticky top-0 z-50 glass-header w-full">
        <!-- Fila Superior: Menú Sándwich (Índice) + Marca + Estado de Audio -->
        <div class="max-w-4xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
            <button id="btn-open-drawer" aria-label="Abrir Índice Completo" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-800/90 hover:bg-brand-600/30 border border-slate-700/80 text-white font-semibold text-xs sm:text-sm transition active:scale-95 shadow-sm">
                <i class="ph-bold ph-list text-lg text-brand-400"></i>
                <span>ÍNDICE</span>
            </button>

            <div class="flex items-center gap-1.5 truncate">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-display font-bold text-xs sm:text-sm tracking-wide bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent truncate">
                    PIANO PRO MASTERCLASS
                </span>
            </div>

            <button id="btn-piano-modal" class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs font-bold hover:bg-amber-500/25 active:scale-95 transition">
                <i class="ph-fill ph-piano-keys text-base"></i>
                <span class="hidden xs:inline">PIANO</span>
            </button>
        </div>

        <!-- Barra de Pestañas Visible de Forma Permanente con Desplazamiento Táctil Horizontal y Auto-centrado -->
        <div class="border-t border-slate-800/80 bg-slate-950/70">
            <nav id="tabs-bar" class="max-w-4xl mx-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar px-3 py-2 scroll-smooth" role="tablist">
                <!-- Generado dinámicamente por JS -->
            </nav>
        </div>
    </header>

    <!-- MENÚ SÁNDWICH (DRAWER VERTICAL COMPLETO CON ÍNDICE JERÁRQUICO) -->
    <div id="drawer-backdrop" class="fixed inset-0 bg-black/75 z-50 hidden opacity-0 transition-opacity duration-200"></div>
    <aside id="drawer-menu" class="fixed top-0 left-0 bottom-0 w-[86vw] max-w-sm bg-slate-950 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 ease-out flex flex-col">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/60">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-books text-brand-400 text-xl"></i>
                <div>
                    <h2 class="font-display font-bold text-sm text-white leading-tight">ÍNDICE MAESTRO</h2>
                    <p class="text-[11px] text-slate-400">Acceso directo a las 14 secciones</p>
                </div>
            </div>
            <button id="btn-close-drawer" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white active:scale-95">
                <i class="ph-bold ph-x text-lg"></i>
            </button>
        </div>
        <div id="drawer-links" class="flex-1 overflow-y-auto p-3 space-y-1.5 divide-y divide-slate-800/40">
            <!-- Generado dinámicamente por JS -->
        </div>
        <div class="p-3 border-t border-slate-800 bg-slate-900/80 text-center">
            <p class="text-[11px] text-slate-400 font-medium">Optimizado para Samsung Galaxy A02s • Edición Agencia</p>
        </div>
    </aside>

    <!-- MODAL SINTETIZADOR DE PIANO INTERACTIVO (TONE.JS) -->
    <div id="piano-drawer" class="fixed bottom-0 left-0 right-0 z-50 bg-slate-950/95 border-t border-brand-500/40 shadow-2xl transform translate-y-full transition-transform duration-300">
        <div class="max-w-3xl mx-auto p-3">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 rounded bg-brand-600 text-[10px] font-bold uppercase">Sintetizador Real</span>
                    <span id="chord-display-label" class="text-xs font-mono text-amber-400 font-semibold">Toca un acorde o tecla</span>
                </div>
                <button id="btn-close-piano" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold flex items-center gap-1">
                    <i class="ph-bold ph-caret-down"></i> Ocultar
                </button>
            </div>
            <!-- Botones rápidos de acordes del tutorial -->
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-2 mb-2">
                <button onclick="playNamedChord('Am(i)', ['A3','C4','E4'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">Am(i)</button>
                <button onclick="playNamedChord('C(bIII / I)', ['C4','E4','G4'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">C(I/bIII)</button>
                <button onclick="playNamedChord('G(bVII / V)', ['G3','B3','D4'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">G(V/bVII)</button>
                <button onclick="playNamedChord('D(IV Dórico)', ['D4','F#4','A4'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">D(IV)</button>
                <button onclick="playNamedChord('Dm(ii / iv)', ['D4','F4','A4'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">Dm(ii/iv)</button>
                <button onclick="playNamedChord('Em(v)', ['E3','G3','B3'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">Em(v)</button>
                <button onclick="playNamedChord('F(IV / bVI)', ['F3','A3','C4'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">F(IV/bVI)</button>
                <button onclick="playNamedChord('Gm(v Mix)', ['G3','Bb3','D4'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">Gm(v)</button>
                <button onclick="playNamedChord('Bb(bVII Mix)', ['Bb3','D4','F4'])" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-xs font-mono font-bold shrink-0 border border-slate-700">Bb(bVII)</button>
            </div>
            <!-- Teclado visual -->
            <div id="virtual-piano" class="relative flex w-full select-none overflow-hidden rounded-lg border border-slate-700">
                <!-- Generado por JS -->
            </div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DE CONTENIDO DE CADA PESTAÑA -->
    <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto px-3.5 pt-4 pb-28">
        <!-- El contenido de la pestaña activa se inyecta aquí -->
    </main>

    <!-- BOTONES FLOTANTES MÓVILES (ARRASTRABLES / DRAGGABLE) -->
    <!-- 1. Botón Flotante Movible: Ir a INICIO desde cualquier lugar -->
    <button id="fab-home" title="Arrastrar o pulsar para ir a INICIO" style="bottom: 92px; left: 14px;" class="draggable-fab flex items-center gap-1.5 px-3.5 py-2.5 rounded-full bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-display font-bold text-xs shadow-lg shadow-brand-600/40 border border-brand-400/50">
        <i class="ph-fill ph-house text-base"></i>
        <span>INICIO</span>
        <i class="ph ph-dots-six-vertical text-xs opacity-60 ml-0.5"></i>
    </button>

    <!-- 2. Botón Flotante Movible: Ir ARRIBA (al comienzo de la pestaña actual) -->
    <button id="fab-top" title="Arrastrar o pulsar para ir al comienzo de la pestaña actual" style="bottom: 92px; right: 14px;" class="draggable-fab flex items-center gap-1.5 px-3.5 py-2.5 rounded-full bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-display font-extrabold text-xs shadow-lg shadow-amber-500/30 border border-amber-300/60">
        <i class="ph-bold ph-arrow-up text-base"></i>
        <span>ARRIBA</span>
        <i class="ph ph-dots-six-vertical text-xs opacity-60 ml-0.5"></i>
    </button>

    <!-- Notificación Toast para Copiar Prompts -->
    <div id="toast-msg" class="fixed top-28 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow-xl hidden items-center gap-2">
        <i class="ph-bold ph-check-circle text-base"></i>
        <span id="toast-text">Copiado al portapapeles</span>
    </div>

    <script>
        /* =========================================================================
           1. HELPER PARA TODOS LOS ENLACES URL CON BOTÓN "Abrir en otra Ventana"
           ========================================================================= */
        function renderUrlCard(title, url, subtitle = "Recurso Externo Verificado") {
            return `
                <div class="my-3 p-3.5 rounded-2xl bg-slate-900/95 border border-brand-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-md">
                    <div class="min-w-0">
                        <div class="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-brand-400 mb-0.5">
                            <i class="ph-fill ph-link-simple"></i>
                            <span>${subtitle}</span>
                        </div>
                        <p class="font-bold text-white text-sm truncate">${title}</p>
                        <p class="text-xs font-mono text-slate-400 truncate mt-0.5">${url}</p>
                    </div>
                    <a href="${url}" target="_blank" rel="noopener noreferrer" onclick="window.open('${url}', '_blank', 'noopener,noreferrer'); return false;" class="shrink-0 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-display font-bold text-xs shadow-md shadow-brand-600/20 active:scale-95 transition">
                        <span>Abrir en otra Ventana</span>
                        <i class="ph-bold ph-arrow-square-out text-base"></i>
                    </a>
                </div>
            `;
        }

        /* =========================================================================
           2. BASE DE DATOS COMPLETA DEL MANUAL POR PESTAÑAS (0 a 13)
           ========================================================================= */
        const TABS_DATA = [
            {
                id: 'inicio',
                shortLabel: 'INICIO',
                badge: 'PORTADA & ÍNDICE',
                // REGLA ESTRICTA: Solo en la pestaña de INICIO el título agrega "by Rubén Sbarsky"
                title: 'MANUAL Y TUTORIAL INTEGRAL DE PATRONES DE ACORDES ESENCIALES PARA PIANO by Rubén Sbarsky',
                subtitle: 'Edición Digital Interactiva • Armonía Funcional, Modos, Voz, Ejemplos Comerciales y Práctica',
                content: `
                    <!-- Hero Impactante -->
                    <div class="relative overflow-hidden rounded-3xl premium-card-highlight p-5 sm:p-7 mb-6 border border-brand-500/40">
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/20 border border-brand-400/30 text-brand-300 text-xs font-bold mb-3">
                            <i class="ph-fill ph-sparkle"></i>
                            <span>EXPERIENCIA INTERACTIVA DE AGENCIA DIGITAL</span>
                        </div>
                        <h1 class="font-display font-black text-2xl sm:text-4xl text-white leading-tight mb-3">
                            MANUAL Y TUTORIAL INTEGRAL DE PATRONES DE ACORDES ESENCIALES PARA PIANO <span class="text-amber-400 underline decoration-amber-500/50">by Rubén Sbarsky</span>
                        </h1>
                        <p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-5">
                            Domina los <strong>5 patrones armónicos cerrados</strong> y las <strong>3 progresiones bonus</strong> en modo Dórico, Mayor, Eólico y Mixolidio con los que se han compuesto miles de éxitos internacionales. Incluye sintetizador de piano en vivo para escuchar cada acorde e inversión al instante.
                        </p>
                        <div class="flex flex-wrap gap-2.5">
                            <button onclick="selectTab(1)" class="px-5 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-display font-extrabold text-xs sm:text-sm flex items-center gap-2 shadow-lg shadow-amber-500/25 active:scale-95 transition">
                                <span>EMPEZAR MÓDULO 0</span>
                                <i class="ph-bold ph-arrow-right"></i>
                            </button>
                            <button onclick="togglePianoDrawer(true); playProgressionDemo([['A3','C4','E4'],['C4','E4','G4'],['G3','B3','D4'],['D4','F#4','A4']], 'Cascada Plagal: Am - C - G - D')" class="px-4 py-3 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-white font-semibold text-xs sm:text-sm flex items-center gap-2 border border-slate-600 active:scale-95 transition">
                                <i class="ph-fill ph-play-circle text-lg text-brand-400"></i>
                                <span>Escuchar Demo Patrón 1</span>
                            </button>
                        </div>
                    </div>

                    <!-- Resumen de Características Rápidas -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-6">
                        <div class="premium-card p-3.5 rounded-2xl text-center">
                            <p class="text-2xl font-display font-black text-brand-400">5 + 3</p>
                            <p class="text-xs text-slate-400 mt-0.5">Patrones y Bonus</p>
                        </div>
                        <div class="premium-card p-3.5 rounded-2xl text-center">
                            <p class="text-2xl font-display font-black text-amber-400">4 Modos</p>
                            <p class="text-xs text-slate-400 mt-0.5">Dórico, Mayor, Eólico, Mix.</p>
                        </div>
                        <div class="premium-card p-3.5 rounded-2xl text-center">
                            <p class="text-2xl font-display font-black text-emerald-400">33 Q&A</p>
                            <p class="text-xs text-slate-400 mt-0.5">Básico, Avanzado y PRO</p>
                        </div>
                        <div class="premium-card p-3.5 rounded-2xl text-center">
                            <p class="text-2xl font-display font-black text-sky-400">Audio Real</p>
                            <p class="text-xs text-slate-400 mt-0.5">Piano Sintetizado</p>
                        </div>
                    </div>

                    <!-- ÍNDICE MAESTRO JERÁRQUICO Y NUMERADO -->
                    <div class="premium-card rounded-3xl p-4 sm:p-6 mb-6">
                        <div class="flex items-center gap-2.5 mb-4 pb-3 border-b border-slate-800">
                            <i class="ph-fill ph-list-numbers text-2xl text-brand-400"></i>
                            <div>
                                <h2 class="font-display font-extrabold text-lg text-white">ÍNDICE MAESTRO JERÁRQUICO Y NUMERADO</h2>
                                <p class="text-xs text-slate-400">Pulsa sobre cualquier módulo para abrir directamente su pestaña</p>
                            </div>
                        </div>

                        <div class="space-y-3 text-xs sm:text-sm">
                            <div onclick="selectTab(1)" class="p-3 rounded-2xl bg-slate-900/90 hover:bg-slate-800/80 border border-slate-800 cursor-pointer transition">
                                <p class="font-bold text-brand-400 mb-1">1.0 MÓDULO 0: FUNDAMENTOS DEL PIANO Y TEORÍA INICIAL</p>
                                <ul class="text-slate-300 space-y-1 pl-3 border-l border-slate-700 text-xs">
                                    <li>1.1 Introducción a la armonía funcional en el piano</li>
                                    <li>1.2 Sistema americano de notación musical</li>
                                    <li>1.3 Tipos de progresiones armónicas: Abiertas vs. Cerradas (Bucles) [1, 2]</li>
                                    <li>1.4 Concepto de atonicidad, triadas y acordes de intercambio modal [1, 2]</li>
                                    <li>1.5 Modos armónicos primarios: Modo Eólico vs. Modo Dórico vs. Modo Mixolidio [3, 6, 11]</li>
                                </ul>
                            </div>

                            <div onclick="selectTab(2)" class="p-3 rounded-2xl bg-slate-900/90 hover:bg-slate-800/80 border border-slate-800 cursor-pointer transition">
                                <p class="font-bold text-amber-400 mb-1">2.0 MÓDULO 1: PATRÓN 1 - LA CASCADA PLAGAL EN MODO DÓRICO</p>
                                <ul class="text-slate-300 space-y-1 pl-3 border-l border-slate-700 text-xs">
                                    <li>2.1 Definición y fórmula del Patrón 1: i - bIII - bVII - IV [3]</li>
                                    <li>2.2 Análisis tonal: El rol del cuarto grado mayor IV y la cadencia plagal [3]</li>
                                    <li>2.3 Movimiento de fundamentales por cuartas descendentes [3]</li>
                                    <li>2.4 Construcción nota por nota en tonalidad de A(I) menor dórico</li>
                                    <li>2.5 Ejemplos del repertorio comercial e internacional [4]</li>
                                    <li>2.6 Guía de ejecución en piano paso a paso</li>
                                </ul>
                            </div>

                            <div onclick="selectTab(3)" class="p-3 rounded-2xl bg-slate-900/90 hover:bg-slate-800/80 border border-slate-800 cursor-pointer transition">
                                <p class="font-bold text-emerald-400 mb-1">3.0 MÓDULO 2: PATRÓN 2 - LA PROGRESIÓN PLAGAL EN MODO MAYOR</p>
                                <ul class="text-slate-300 space-y-1 pl-3 border-l border-slate-700 text-xs">
                                    <li>3.1 Definición y fórmula del Patrón 2: I - V - ii - IV [5]</li>
                                    <li>3.2 Transformación del modo menor al modo mayor [5]</li>
                                    <li>3.3 Análisis de cadencias: Cadencia rota (V al ii) y resolución plagal (IV al I) [5]</li>
                                    <li>3.4 Construcción nota por nota en tonalidad de C(I) mayor</li>
                                    <li>3.5 Ejemplos en canciones populares e internacionales [5, 6]</li>
                                    <li>3.6 Práctica guiada e independencia de manos</li>
                                </ul>

                            <div class="flex items-center gap-2.5 min-w-0">
                                <span class="shrink-0 w-7 h-7 rounded-lg bg-slate-800 font-mono font-bold text-xs flex items-center justify-center text-brand-400">#${item.n}</span>
                                <span class="text-xs sm:text-sm font-bold text-white leading-snug">${item.q}</span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badgeColor}">${item.label}</span>
                                <i class="ph-bold ph-caret-down text-slate-400 group-open:rotate-180 transition-transform"></i>
                            </div>
                        </summary>
                        <div class="px-4 pb-4 pt-2 text-xs sm:text-sm text-slate-300 border-t border-slate-800/80 bg-slate-950/50 leading-relaxed">
                            <strong class="text-brand-400">Respuesta:</strong> ${item.a}
                        </div>
                    </details>
                `;
            }).join('');
        }

        /* =========================================================================
           6. BOTONES FLOTANTES MOVIBLES (DRAGGABLE EN TÁCTIL Y RATÓN)
           ========================================================================= */
        function makeDraggable(el, onClickAction) {
            let isDragging = false;
            let hasMoved = false;
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;

            function onStart(clientX, clientY) {
                isDragging = true;
                hasMoved = false;
                startX = clientX;
                startY = clientY;
                const rect = el.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                el.style.bottom = 'auto';
                el.style.right = 'auto';
                el.style.left = `${initialLeft}px`;
                el.style.top = `${initialTop}px`;
            }

            function onMove(clientX, clientY) {
                if (!isDragging) return;
                const dx = clientX - startX;
                const dy = clientY - startY;
                if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
                    hasMoved = true;
                }
                if (hasMoved) {
                    const maxX = window.innerWidth - el.offsetWidth - 6;
                    const maxY = window.innerHeight - el.offsetHeight - 6;
                    const newLeft = Math.max(6, Math.min(maxX, initialLeft + dx));
                    const newTop = Math.max(6, Math.min(maxY, initialTop + dy));
                    el.style.left = `${newLeft}px`;
                    el.style.top = `${newTop}px`;
                }
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                if (!hasMoved && typeof onClickAction === 'function') {
                    onClickAction();
                }
            }

            // Eventos Touch (Samsung Galaxy A02s)
            el.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    onStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    onMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchend', () => onEnd());

            // Eventos Mouse (Escritorio)
            el.addEventListener('mousedown', (e) => {
                e.preventDefault();
                onStart(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => {
                if (isDragging) onMove(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', () => onEnd());
        }

        /* =========================================================================
           7. SINTETIZADOR DE PIANO REAL (TONE.JS)
           ========================================================================= */
        let synth = null;
        const PIANO_NOTES = [
            { note: 'E3', type: 'white', label: 'E' },
            { note: 'F3', type: 'white', label: 'F' },
            { note: 'F#3', type: 'black', label: 'F#', left: '10.5%' },
            { note: 'G3', type: 'white', label: 'G' },
            { note: 'G#3', type: 'black', label: 'G#', left: '20.5%' },
            { note: 'A3', type: 'white', label: 'A' },
            { note: 'Bb3', type: 'black', label: 'Bb', left: '30.5%' },
            { note: 'B3', type: 'white', label: 'B' },
            { note: 'C4', type: 'white', label: 'C' },
            { note: 'C#4', type: 'black', label: 'C#', left: '50.5%' },
            { note: 'D4', type: 'white', label: 'D' },
            { note: 'D#4', type: 'black', label: 'D#', left: '60.5%' },
            { note: 'E4', type: 'white', label: 'E' },
            { note: 'F4', type: 'white', label: 'F' },
            { note: 'F#4', type: 'black', label: 'F#', left: '80.5%' },
            { note: 'G4', type: 'white', label: 'G' },
            { note: 'A4', type: 'white', label: 'A' }
        ];

        function initAudio() {
            if (!synth && window.Tone) {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 1.1 }
                }).toDestination();
            }
        }

        function buildVirtualPiano() {
            const container = document.getElementById('virtual-piano');
            container.innerHTML = '';
            PIANO_NOTES.forEach(item => {
                const key = document.createElement('button');
                key.dataset.note = item.note;
                if (item.type === 'white') {
                    key.className = 'piano-key-white';
                } else {
                    key.className = 'piano-key-black';
                    key.style.left = item.left;
                }
                key.innerHTML = `<span>${item.label}</span>`;
                key.onclick = () => playSingleNote(item.note);
                container.appendChild(key);
            });
        }

        async function playSingleNote(note) {
            try {
                await Tone.start();
                initAudio();
                synth.triggerAttackRelease(note, '8n');
                highlightKeys([note]);
                document.getElementById('chord-display-label').textContent = `Nota: ${note}`;
            } catch (e) {}
        }

        async function playNamedChord(label, notes) {
            try {
                await Tone.start();
                initAudio();
                synth.triggerAttackRelease(notes, '2n');
                highlightKeys(notes);
                document.getElementById('chord-display-label').textContent = label;
            } catch (e) {}
        }

        async function playProgressionDemo(chordsArray, title) {
            try {
                await Tone.start();
                initAudio();
                document.getElementById('chord-display-label').textContent = title;
                chordsArray.forEach((chord, i) => {
                    setTimeout(() => {
                        synth.triggerAttackRelease(chord, '2n');
                        highlightKeys(chord);
                    }, i * 750);
                });
            } catch (e) {}
        }

        function highlightKeys(notes) {
            document.querySelectorAll('#virtual-piano button').forEach(btn => {
                btn.classList.remove('active');
                if (notes.includes(btn.dataset.note)) {
                    btn.classList.add('active');
                }
            });
            setTimeout(() => {
                document.querySelectorAll('#virtual-piano button.active').forEach(btn => btn.classList.remove('active'));
            }, 650);
        }

        /* =========================================================================
           8. UTILIDADES (DRAWER, COPIAR PORTAPAPELES, INICIALIZACIÓN)
           ========================================================================= */
        function toggleDrawer(open) {
            const drawer = document.getElementById('drawer-menu');
            const backdrop = document.getElementById('drawer-backdrop');
            if (open) {
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.classList.add('opacity-100'), 10);
                drawer.classList.remove('-translate-x-full');
            } else {
                backdrop.classList.remove('opacity-100');
                drawer.classList.add('-translate-x-full');
                setTimeout(() => backdrop.classList.add('hidden'), 250);
            }
        }

        function togglePianoDrawer(open) {
            const pDrawer = document.getElementById('piano-drawer');
            if (open) {
                pDrawer.classList.remove('translate-y-full');
            } else {
                pDrawer.classList.add('translate-y-full');
            }
        }

        function copyPromptText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            const toast = document.getElementById('toast-msg');
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2200);
        }

        window.onload = function () {
            buildVirtualPiano();
            selectTab(0);

            // Eventos Menú Sándwich (Índice)
            document.getElementById('btn-open-drawer').onclick = () => toggleDrawer(true);
            document.getElementById('btn-close-drawer').onclick = () => toggleDrawer(false);
            document.getElementById('drawer-backdrop').onclick = () => toggleDrawer(false);

            // Eventos Modal Piano
            document.getElementById('btn-piano-modal').onclick = () => {
                const isHidden = document.getElementById('piano-drawer').classList.contains('translate-y-full');
                togglePianoDrawer(isHidden);
            };
            document.getElementById('btn-close-piano').onclick = () => togglePianoDrawer(false);

            // Inicializar los dos botones flotantes movibles (INICIO y ARRIBA)
            makeDraggable(document.getElementById('fab-home'), () => {
                selectTab(0);
            });
            makeDraggable(document.getElementById('fab-top'), () => {
                scrollToCurrentTabTop();
            });
        };
    </script>
</body>
